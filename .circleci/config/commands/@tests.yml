eunit:
  parameters:
    otp:
      type: string
    target:
      type: string
  steps:
    - fixed_checkout
    - restore_rebar_cache
    - restore_build_cache:
        otp: << parameters.otp >>
    - run:
        name: Test
        command: |
          epmd -daemon
          make eunit-<< parameters.target >>
    - store_test_results:
        path: eunit_report
    - store_rebar3_crashdump
    - fail_notification

common_tests:
  parameters:
    otp:
      type: string
    target:
      type: string
  steps:
    - fixed_checkout
    - restore_rebar_cache
    - restore_build_cache:
        otp: << parameters.otp >>
    - run:
        name: Test
        command: |
          epmd -daemon
          set +e
          make << parameters.target >> CT_TEST_FLAGS="--suite=$(.circleci/scripts/split_suites.sh)" 2>&1 | tee ct_run.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # A loaded/throttled CI runner can starve a test of scheduling long enough
            # to hit its own timeout budget (e.g. aesc_fsm_SUITE's {outer_timeout, ...},
            # or aehttp_hyperchains_SUITE's {timeout_waiting_for_block, ...}) - this is
            # CI flakiness, not a code defect. Only retry the whole run when EVERY
            # failure this run has a reason atom containing "timeout"; a genuine
            # assertion/logic failure alongside one is left to fail as-is.
            # rebar3/ct colorizes FAILED/the reason with ANSI codes and writes \r\n
            # line endings, so strip both before matching on either.
            sed -E 's/\x1b\[[0-9;]*m//g' ct_run.log | tr -d '\r' > ct_run_clean.log
            failed_count=$(grep -c ': FAILED$' ct_run_clean.log)
            timeout_count=$(grep -cE '==> \{[a-z_]*timeout[a-z_]*,' ct_run_clean.log)
            if [ "$failed_count" -gt 0 ] && [ "$failed_count" -eq "$timeout_count" ]; then
              echo "WARNING: all $failed_count failure(s) were test timeouts, retrying" >&2
              make << parameters.target >> CT_TEST_FLAGS="--suite=$(.circleci/scripts/split_suites.sh)" 2>&1 | tee -a ct_run.log
              status=${PIPESTATUS[0]}
            fi
          fi
          exit $status
    # Isolates the junit.xml report because additional files in _build/test/logs
    # are somehow causing issue with xunit report upload, parsing and merging
    - run:
        name: Prepare test report
        command: |
          mkdir _build/test/reports
          mv _build/test/logs/junit.xml _build/test/reports/
        when: always
    - store_test_results:
        path: _build/test/reports
    - run:
        name: Prepare artifacts
        command: |
          find _build/test/logs -iname bin | xargs rm -rf
          find _build/test/logs -iname data | xargs rm -rf
          find _build/test/logs -iname releases | xargs rm -rf
          find _build/test/logs -iname extensions | xargs rm -rf
          find _build/test/logs -iname hooks | xargs rm -rf
          mv _build/test/logs test_logs
        when: on_fail
    - store_artifacts:
        path: test_logs
    - store_rebar3_crashdump
    - fail_notification

test_arch_os_dependencies:
  steps:
    - run:
        name: Test architecture or OS specific functions
        command: |
          make test-arch-os-dependencies

run_docker_system_test:
  steps:
    - run:
        name: Install deps for system tests
        command: |
          make system-test-deps
    - run:
        name: System Tests
        no_output_timeout: 2h
        command: |
          # The host system might run with "any" UID while the aeternity containers run with 1000:1000
          # umask is not great idea, but this is private CI after all, no better solutions without changing the tests
          umask 0
          make system-test

run_docker_system_smoke_test:
  steps:
    - run:
        name: Install deps for system smoke tests
        command: |
          make system-smoke-test-deps
    - run:
        name: System Smoke Tests
        no_output_timeout: 1h
        command: |
          # The host system might run with "any" UID while the aeternity containers run with 1000:1000
          # umask is not great idea, but this is private CI after all, no better solutions without changing the tests
          umask 0
          make smoke-test-run

docker_system_test:
  parameters:
    smoke:
      type: boolean
    system_test_host_logs:
      type: string
      default: /tmp/system_test_host
    system_test_logs:
      type: string
      default: system_test/logs
  steps:
    - run:
        name: Print system test host information
        command: |
          uname -a
          free -t -m
    - fixed_checkout
    - install_os_deps
    - install_otp
    - install_libsodium
    - restore_rebar_cache
    - restore_machine_build_cache
    - when:
        condition:
          not: << parameters.smoke >>
        steps:
          - run_docker_system_test
    - when:
        condition: << parameters.smoke >>
        steps:
          - run_docker_system_smoke_test
    - fail_notification
    - save_machine_build_cache
    - store_test_results:
        path: << parameters.system_test_logs >>
    - store_artifacts:
        path: << parameters.system_test_logs >>
    - store_artifacts:
        path: << parameters.system_test_host_logs >>
